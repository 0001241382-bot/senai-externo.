<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-assets>
      <img id="sala1" src="panorama.jpeg">
    </a-assets>

    <a-sky src="#sala1"></a-sky>

    <!-- Tela do vídeo, escondida até o usuário olhar para o ponto -->
    <a-video id="tela-video" src="#vid" position="0 1.6 -3"
             width="3" height="1.7" visible="false"></a-video>

    <!-- Câmera com cursor de "olhar" (sem controle) -->
    <a-entity camera look-controls position="0 1.6 0">
      <a-cursor fuse="true" fuse-timeout="1500" raycaster="objects: .clicavel"></a-cursor>
    </a-entity>
  </a-scene>
</body>
</html>
